<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KyKom - Baca Komik Online</title>
  <meta name="description" content="KyKom - Baca manga dan komik favorit kamu secara gratis, kapan saja dan di mana saja." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />

  <!-- React & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #080810; color: #f0f0f8; font-family: 'Nunito', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #080810; }
    ::-webkit-scrollbar-thumb { background: #e63946; border-radius: 3px; }
    #root { min-height: 100vh; }

    /* Loading screen sebelum React mount */
    #splash {
      position: fixed; inset: 0; background: #080810;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; transition: opacity .4s;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      font-family: 'Bangers', cursive;
      font-size: 64px; letter-spacing: 8px;
      animation: pulse 1.2s infinite;
    }
    .splash-logo span:first-child { color: #e63946; }
    .splash-logo span:last-child  { color: #f0f0f8; }
    .splash-sub { color: #555; margin-top: 12px; font-size: 13px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Global card & hover */
    .mc  { transition: transform .2s, box-shadow .2s; cursor: pointer; }
    .mc:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(230,57,70,.25) !important; }
    .mc:hover .ov { opacity: 1 !important; }
    .chr:hover { background: #16162a !important; cursor: pointer; }
    .btn { cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800; transition: opacity .15s; border: none; }
    .btn:hover { opacity: .85; }
    .inp { font-family: 'Nunito', sans-serif; }
    .inp:focus { border-color: #e63946 !important; outline: none; }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-logo"><span>KY</span><span>KOM</span></div>
    <div class="splash-sub">Memuat aplikasi...</div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API = "https://api.mangadex.org";
    const CDN = "https://uploads.mangadex.org";

    // ─── HELPERS ─────────────────────────────────────────
    function getCover(m) {
      const rel = m?.relationships?.find(r => r.type === "cover_art");
      if (!rel?.attributes?.fileName) return null;
      return `${CDN}/covers/${m.id}/${rel.attributes.fileName}.256.jpg`;
    }
    function getTitle(m) {
      const t = m?.attributes?.title;
      if (!t) return "Unknown";
      return t.en || t["ja-ro"] || t.ja || Object.values(t)[0] || "Unknown";
    }
    function getDesc(m) {
      const d = m?.attributes?.description;
      if (!d) return "Tidak ada deskripsi.";
      return (d.en || Object.values(d)[0] || "").slice(0, 320);
    }
    function getGenres(m) {
      return (m?.attributes?.tags || [])
        .filter(t => t.attributes.group === "genre")
        .slice(0, 3)
        .map(t => t.attributes.name.en || Object.values(t.attributes.name)[0]);
    }

    // ─── APP ─────────────────────────────────────────────
    function KyKom() {
      const [view, setView]                   = useState("home");
      const [homeData, setHomeData]           = useState([]);
      const [selectedManga, setSelectedManga] = useState(null);
      const [chapters, setChapters]           = useState([]);
      const [readerData, setReaderData]       = useState(null);
      const [currentChapter, setCurrentChapter] = useState(null);
      const [searchQuery, setSearchQuery]     = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [loading, setLoading]             = useState(false);
      const [currentPage, setCurrentPage]     = useState(0);
      const [inputVal, setInputVal]           = useState("");

      useEffect(() => {
        fetchHome();
        // Sembunyikan splash setelah React mount
        const splash = document.getElementById("splash");
        if (splash) { setTimeout(() => splash.classList.add("hide"), 300); }
      }, []);

      async function fetchHome() {
        setLoading(true);
        try {
          const res = await fetch(`${API}/manga?limit=18&includes[]=cover_art&order[followedCount]=desc&availableTranslatedLanguage[]=en&contentRating[]=safe&contentRating[]=suggestive`);
          const d   = await res.json();
          setHomeData(d.data || []);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      async function openManga(id) {
        setLoading(true);
        try {
          const [mr, cr] = await Promise.all([
            fetch(`${API}/manga/${id}?includes[]=cover_art&includes[]=author&includes[]=artist`),
            fetch(`${API}/manga/${id}/feed?limit=96&translatedLanguage[]=en&order[chapter]=asc`)
          ]);
          const md = await mr.json();
          const cd = await cr.json();
          setSelectedManga(md.data);
          setChapters(cd.data || []);
          setView("detail");
          window.scrollTo(0, 0);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      async function openChapter(ch) {
        setLoading(true);
        setCurrentChapter(ch);
        try {
          const res = await fetch(`${API}/at-home/server/${ch.id}`);
          const d   = await res.json();
          setReaderData(d);
          setCurrentPage(0);
          setView("reader");
          window.scrollTo(0, 0);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      async function doSearch(q) {
        if (!q.trim()) return;
        setLoading(true);
        try {
          const res = await fetch(`${API}/manga?title=${encodeURIComponent(q)}&limit=18&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive`);
          const d   = await res.json();
          setSearchResults(d.data || []);
          setView("search");
          window.scrollTo(0, 0);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      const pages = readerData
        ? readerData.chapter.data.map(f => `${readerData.baseUrl}/data/${readerData.chapter.hash}/${f}`)
        : [];

      const goHome = () => { setView("home"); setInputVal(""); };

      // ─── NAVBAR ────────────────────────────────────────
      function Navbar() {
        return (
          <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(6,6,14,.94)",backdropFilter:"blur(14px)",borderBottom:"1px solid #1e1e35",display:"flex",alignItems:"center",gap:16,padding:"10px 20px",flexWrap:"wrap"}}>
            <div onClick={goHome} style={{cursor:"pointer",display:"flex",alignItems:"center",userSelect:"none"}}>
              <span style={{fontFamily:"'Bangers',cursive",fontSize:30,letterSpacing:2,color:"#e63946",textShadow:"0 0 18px rgba(230,57,70,.5)"}}>KY</span>
              <span style={{fontFamily:"'Bangers',cursive",fontSize:30,letterSpacing:2,color:"#f0f0f8"}}>KOM</span>
            </div>
            <div style={{flex:1,display:"flex",gap:8,maxWidth:440}}>
              <input className="inp" value={inputVal}
                onChange={e=>setInputVal(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter"){setSearchQuery(inputVal);doSearch(inputVal);}}}
                placeholder="Cari judul komik..."
                style={{flex:1,padding:"7px 13px",borderRadius:7,background:"#10101c",border:"1px solid #1e1e35",color:"#f0f0f8",fontSize:13}}
              />
              <button className="btn" onClick={()=>{setSearchQuery(inputVal);doSearch(inputVal);}}
                style={{padding:"7px 16px",borderRadius:7,background:"#e63946",color:"#fff",fontSize:13}}>
                Cari
              </button>
            </div>
          </nav>
        );
      }

      // ─── LOADING SCREEN ────────────────────────────────
      if (loading) return (
        <div style={{minHeight:"100vh",background:"#080810",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <Navbar />
          <div style={{fontFamily:"'Bangers',cursive",fontSize:52,letterSpacing:6,marginBottom:12}}>
            <span style={{color:"#e63946"}}>KY</span>
            <span style={{color:"#f0f0f8"}}>KOM</span>
          </div>
          <div style={{color:"#8888aa",fontSize:14}}>Sedang memuat...</div>
        </div>
      );

      // ─── READER ────────────────────────────────────────
      if (view === "reader") return (
        <div style={{minHeight:"100vh",background:"#04040a",color:"#f0f0f8"}}>
          <Navbar />
          <div style={{maxWidth:780,margin:"0 auto",padding:"20px 16px"}}>

            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
              <button className="btn" onClick={()=>setView("detail")} style={{padding:"6px 14px",borderRadius:6,border:"1px solid #1e1e35",background:"transparent",color:"#aaaacc",fontSize:13}}>
                ← Kembali
              </button>
              <span style={{fontWeight:700,fontSize:14}}>
                Ch.{currentChapter?.attributes?.chapter}
                {currentChapter?.attributes?.title &&
                  <span style={{color:"#8888aa",fontWeight:400}}> — {currentChapter.attributes.title}</span>}
              </span>
              <span style={{marginLeft:"auto",color:"#8888aa",fontSize:12}}>{currentPage+1} / {pages.length}</span>
            </div>

            <div style={{textAlign:"center",marginBottom:14}}>
              <img src={pages[currentPage]} alt={`Halaman ${currentPage+1}`}
                style={{maxWidth:"100%",borderRadius:4,boxShadow:"0 4px 32px rgba(0,0,0,.7)"}} />
            </div>

            <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:20}}>
              <button className="btn" onClick={()=>setCurrentPage(p=>Math.max(0,p-1))} disabled={currentPage===0}
                style={{padding:"10px 26px",borderRadius:8,fontSize:14,background:currentPage===0?"#1e1e35":"#e63946",color:currentPage===0?"#555":"#fff",cursor:currentPage===0?"not-allowed":"pointer"}}>
                ← Sebelumnya
              </button>
              <button className="btn" onClick={()=>setCurrentPage(p=>Math.min(pages.length-1,p+1))} disabled={currentPage===pages.length-1}
                style={{padding:"10px 26px",borderRadius:8,fontSize:14,background:currentPage===pages.length-1?"#1e1e35":"#e63946",color:currentPage===pages.length-1?"#555":"#fff",cursor:currentPage===pages.length-1?"not-allowed":"pointer"}}>
                Selanjutnya →
              </button>
            </div>

            <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"center",paddingBottom:32}}>
              {pages.map((_,i)=>(
                <div key={i} onClick={()=>setCurrentPage(i)}
                  style={{width:28,height:28,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,cursor:"pointer",
                    background:i===currentPage?"#e63946":"#10101c",
                    border:i===currentPage?"none":"1px solid #1e1e35",
                    color:i===currentPage?"#fff":"#8888aa",transition:"all .15s"}}>
                  {i+1}
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // ─── DETAIL ────────────────────────────────────────
      if (view === "detail" && selectedManga) {
        const cover  = getCover(selectedManga);
        const title  = getTitle(selectedManga);
        const author = selectedManga.relationships?.find(r=>r.type==="author")?.attributes?.name;
        const status = selectedManga.attributes?.status;

        return (
          <div style={{minHeight:"100vh",background:"#080810",color:"#f0f0f8"}}>
            <Navbar />

            <div style={{position:"relative",height:260,overflow:"hidden",background:"#04040a"}}>
              {cover && <img src={cover} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",filter:"blur(22px) brightness(.25)",transform:"scale(1.1)"}} />}
              <div style={{position:"relative",zIndex:1,display:"flex",gap:20,padding:"28px 24px",maxWidth:880,margin:"0 auto",height:"100%",alignItems:"flex-end"}}>
                {cover && <img src={cover} alt={title} style={{width:120,height:175,objectFit:"cover",borderRadius:8,boxShadow:"0 8px 32px rgba(0,0,0,.8)",border:"2px solid #1e1e35",flexShrink:0}} />}
                <div style={{paddingBottom:6}}>
                  <button className="btn" onClick={goHome} style={{padding:"4px 12px",borderRadius:5,border:"1px solid #1e1e35",background:"transparent",color:"#8888aa",fontSize:12,marginBottom:10}}>
                    ← Beranda
                  </button>
                  <h1 style={{fontFamily:"'Bangers',cursive",fontSize:"clamp(20px,3vw,34px)",letterSpacing:1,lineHeight:1.15,marginBottom:8}}>{title}</h1>
                  {author && <div style={{color:"#8888aa",fontSize:12,marginBottom:8}}>oleh {author}</div>}
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {getGenres(selectedManga).map(g=>(
                      <span key={g} style={{padding:"2px 9px",borderRadius:99,background:"#1a0a0d",fontSize:10,fontWeight:700,color:"#e63946"}}>{g}</span>
                    ))}
                    {status && <span style={{padding:"2px 9px",borderRadius:99,background:"#1a1a0a",fontSize:10,fontWeight:700,color:"#ffd60a"}}>{status}</span>}
                  </div>
                </div>
              </div>
            </div>

            <div style={{maxWidth:880,margin:"0 auto",padding:"20px 24px"}}>
              <p style={{color:"#aaaacc",lineHeight:1.75,marginBottom:24,fontSize:13}}>{getDesc(selectedManga)}</p>
              <h2 style={{fontFamily:"'Bangers',cursive",fontSize:24,letterSpacing:1,marginBottom:12,color:"#e63946"}}>
                Daftar Chapter ({chapters.length})
              </h2>
              {chapters.length === 0
                ? <div style={{color:"#8888aa",padding:"32px 0",textAlign:"center"}}>Tidak ada chapter tersedia (bahasa Inggris).</div>
                : <div style={{display:"flex",flexDirection:"column",gap:3}}>
                    {chapters.map(ch=>(
                      <div key={ch.id} className="chr"
                        onClick={()=>openChapter(ch)}
                        style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderRadius:6,background:"#10101c",border:"1px solid #1e1e35",transition:"background .15s"}}>
                        <span style={{fontWeight:700,fontSize:13}}>
                          Chapter {ch.attributes?.chapter || "?"}
                          {ch.attributes?.title && <span style={{fontWeight:400,color:"#8888aa"}}> — {ch.attributes.title}</span>}
                        </span>
                        <span style={{fontSize:11,color:"#8888aa",flexShrink:0,marginLeft:12}}>
                          {new Date(ch.attributes?.publishAt).toLocaleDateString("id-ID")}
                        </span>
                      </div>
                    ))}
                  </div>
              }
            </div>
          </div>
        );
      }

      // ─── HOME / SEARCH ─────────────────────────────────
      const displayData = view === "search" ? searchResults : homeData;

      return (
        <div style={{minHeight:"100vh",background:"#080810",color:"#f0f0f8"}}>
          <Navbar />

          {view === "home" && (
            <div style={{background:"linear-gradient(135deg,#0d0d1a 0%,#1a0a0d 100%)",borderBottom:"1px solid #1e1e35",padding:"56px 24px",textAlign:"center"}}>
              <div style={{fontFamily:"'Bangers',cursive",fontSize:"clamp(48px,10vw,90px)",letterSpacing:10,lineHeight:1,userSelect:"none"}}>
                <span style={{color:"#e63946",textShadow:"0 0 60px rgba(230,57,70,.7)"}}>KY</span>
                <span style={{color:"#f0f0f8"}}>KOM</span>
              </div>
              <p style={{color:"#8888aa",marginTop:10,fontSize:15,fontWeight:600}}>
                Baca komik &amp; manga favoritmu — gratis, lengkap, kapan saja
              </p>
              <div style={{display:"flex",gap:10,maxWidth:460,margin:"22px auto 0"}}>
                <input className="inp" value={inputVal}
                  onChange={e=>setInputVal(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter"){setSearchQuery(inputVal);doSearch(inputVal);}}}
                  placeholder="Cari judul komik..."
                  style={{flex:1,padding:"12px 18px",borderRadius:10,background:"#10101c",border:"1px solid #1e1e35",color:"#f0f0f8",fontSize:15}}
                />
                <button className="btn" onClick={()=>{setSearchQuery(inputVal);doSearch(inputVal);}}
                  style={{padding:"12px 22px",borderRadius:10,background:"#e63946",color:"#fff",fontSize:15,boxShadow:"0 4px 20px rgba(230,57,70,.4)"}}>
                  Cari
                </button>
              </div>
            </div>
          )}

          <div style={{maxWidth:1200,margin:"0 auto",padding:"28px 20px"}}>
            <h2 style={{fontFamily:"'Bangers',cursive",fontSize:26,letterSpacing:1,marginBottom:22}}>
              {view === "search" ? `Hasil: "${searchQuery}"` : "🔥 Komik Populer"}
            </h2>

            {displayData.length === 0 && view === "search" && (
              <div style={{textAlign:"center",color:"#8888aa",padding:"60px 0",fontSize:15}}>
                Tidak ada hasil untuk "<b>{searchQuery}</b>"
              </div>
            )}

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:18}}>
              {displayData.map(m=>{
                const cover = getCover(m);
                return (
                  <div key={m.id} className="mc"
                    onClick={()=>openManga(m.id)}
                    style={{borderRadius:10,overflow:"hidden",background:"#10101c",border:"1px solid #1e1e35",boxShadow:"0 4px 16px rgba(0,0,0,.4)"}}>
                    <div style={{position:"relative",paddingTop:"140%",background:"#04040a"}}>
                      {cover
                        ? <img src={cover} alt={getTitle(m)} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} />
                        : <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}}>📖</div>
                      }
                      <div className="ov" style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(230,57,70,.85),transparent)",opacity:0,transition:"opacity .2s",display:"flex",alignItems:"flex-end",padding:10}}>
                        <span style={{color:"#fff",fontSize:11,fontWeight:800}}>Baca Sekarang →</span>
                      </div>
                    </div>
                    <div style={{padding:"9px 10px 11px"}}>
                      <div style={{fontSize:12,fontWeight:700,lineHeight:1.35,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
                        {getTitle(m)}
                      </div>
                      <div style={{marginTop:5,display:"flex",flexWrap:"wrap",gap:3}}>
                        {getGenres(m).slice(0,2).map(g=>(
                          <span key={g} style={{fontSize:8,fontWeight:700,color:"#e63946",background:"#1a0a0d",padding:"2px 5px",borderRadius:3}}>{g}</span>
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <footer style={{borderTop:"1px solid #1e1e35",padding:"20px",textAlign:"center",color:"#444",fontSize:11,marginTop:32}}>
            <span style={{fontFamily:"'Bangers',cursive",color:"#e63946",fontSize:16,marginRight:6}}>KYKOM</span>
            Data komik dari MangaDex API · Dibuat untuk tugas dasar pemrograman
          </footer>
        </div>
      );
    }

    // Mount React
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<KyKom />);
  </script>
</body>
</html>
